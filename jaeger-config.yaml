# Jaeger v2.20 all-in-one for the MCP benchmark POC.
# Released 2.20.0 uses ai.enable_mcp: true (this file). Current main replaced
# that with ai.mcp: {} (#9194). `jaegertracing/jaeger:latest` was still 2.19.0
# when this POC was written and rejects the mcp key entirely.
# MCP is at /api/ai/mcp/ on the query port.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: some_storage
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685
    ai:
      # Session-free telemetry MCP tools. This is the endpoint the harness
      # dials — not the ACP sidecar /api/ai/mcp/<id>/.
      enable_mcp: true

  jaeger_storage:
    backends:
      some_storage:
        memory:
          max_traces: 100000

  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
