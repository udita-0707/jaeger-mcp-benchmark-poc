# Jaeger (MCP-enabled) + OpenTelemetry Demo fault injection for #9135.
#
# Jaeger UI / session-free MCP:  http://localhost:16686
#                               http://localhost:16686/api/ai/mcp/
# Flagd UI (trigger a fault):    http://localhost:4000
# Flagd / OFREP:                 localhost:8013 / localhost:8016
# Cart EmptyCart gRPC/HTTP:      localhost:7070
#
# Pin jaegertracing/jaeger:2.20.0 — that tag is the first release with
# in-process MCP (ai.enable_mcp: true). `:latest` was still 2.19.0 and
# crash-loops with "AIConfig has invalid keys: mcp".
# Demo images match OpenTelemetry Demo 3.0.0.

services:
  # Query UI :16686, OTLP :4317/:4318, MCP at /api/ai/mcp/
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger-mcp-benchmark
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  # Feature-flag service. Edit flagd/demo.flagd.json or use flagd-ui; flagd
  # watches the file. Set cartFailure to 100% to seed the first scenario.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.0
    container_name: jaeger-mcp-flagd
    command: ["start", "--uri", "file:./etc/flagd/demo.flagd.json"]
    volumes:
      - ./flagd:/etc/flagd
    ports:
      - "8013:8013"
      - "8016:8016"
    restart: unless-stopped

  # http://localhost:4000 — change cartFailure here (port to hit to trigger a fault).
  flagd-ui:
    image: ghcr.io/open-telemetry/demo:3.0.0-flagd-ui
    container_name: jaeger-mcp-flagd-ui
    environment:
      - OTEL_SERVICE_NAME=flagd-ui
      - PHX_HOST=localhost
      - PHX_SERVER=true
      - PORT=4000
      - SECRET_KEY_BASE=local-poc-not-a-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8013
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=service.name=flagd-ui,service.namespace=opentelemetry-demo
    ports:
      - "4000:4000"
    volumes:
      - ./flagd:/app/data
    depends_on:
      - flagd
    restart: unless-stopped

  valkey-cart:
    image: ghcr.io/valkey-io/valkey:9.0.4-alpine3.23
    container_name: jaeger-mcp-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped

  # OTel Demo cart service (IMAGE_VERSION 3.0.0). EmptyCart reads cartFailure
  # and, on a hit, dials badhost:1234 — producing oteldemo.CartService/EmptyCart
  # with status Error. Traces export OTLP to the Jaeger above.
  cart:
    image: ghcr.io/open-telemetry/demo:3.0.0-cart
    container_name: jaeger-mcp-cart
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - VALKEY_ADDR=valkey-cart:6379
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8013
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=cart
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=opentelemetry-demo,service.name=cart,service.version=3.0.0
    ports:
      - "7070:8080"
    depends_on:
      - valkey-cart
      - flagd
      - jaeger
    restart: unless-stopped

  # One-shot: docker compose --profile fault run --rm empty-cart
  # Requires cartFailure already set to 100% (Flagd UI or flagd/demo.flagd.json).
  empty-cart:
    image: fullstorydev/grpcurl:latest
    profiles: ["fault"]
    volumes:
      - ./flagd/cart.proto:/proto/cart.proto:ro
    command:
      - -plaintext
      - -import-path
      - /proto
      - -proto
      - cart.proto
      - -d
      - '{"user_id":"benchmark-user"}'
      - cart:8080
      - oteldemo.CartService/EmptyCart
    depends_on:
      - cart
